# Root tooling configuration for the openclaw (CLIO) package.
# Additive only — declares no runtime dependencies and moves/renames nothing.

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
